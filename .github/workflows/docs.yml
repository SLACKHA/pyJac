name: Deploy Docs

on:
  # Deploy only after the test suite has passed on main
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  # A published release additionally refreshes the versioned docs at the root.
  release:
    types: [published]
  # Pull requests build but never deploy, so a broken cross-reference is caught
  # before it reaches main.
  pull_request:
  workflow_dispatch:

concurrency:
  # Serialised rather than cancelled: two deploys racing on gh-pages would
  # conflict, and a superseded build is cheap next to a corrupted site.
  group: docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and doc dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[docs]'

      # -W turns warnings into errors, so a broken cross-reference or an
      # orphaned page fails the build rather than quietly shipping.
      - name: Build docs
        run: sphinx-build -b html -W --keep-going docs/ docs/_build/html

  deploy:
    name: Deploy
    # Only from the official repository, never from forks, and for a
    # workflow_run only when the test suite actually passed.
    if: |
      github.event_name != 'pull_request' &&
      github.repository == 'SLACKHA/pyJac' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; take the
          # commit that was actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and doc dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[docs]'

      - name: Build docs
        run: sphinx-build -b html -W --keep-going docs/ docs/_build/html

      # Two destinations, so a reader can tell which they are looking at:
      #   /       the newest published release
      #   /dev/   whatever is currently on main
      # keep_files stops each deploy from deleting its sibling.
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          destination_dir: ${{ github.event_name == 'release' && '.' || 'dev' }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: >-
            docs: ${{ github.event_name == 'release' && github.ref_name || 'main' }}
            (${{ github.sha }})
