name: Test

on:
  push:
    branches: [main, modernize]
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,pywrap]'

      # The cache-optimizer tests run a randomized search and dominate the
      # runtime; they are covered by the full-suite job below.
      - name: Test
        run: pytest -m "not slow" --cov=pyjac --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage.xml

  full-suite:
    name: Full suite including slow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test,pywrap,cache-opt]'
      - name: Test
        run: pytest

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.1

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build
        run: python -m pip install build && python -m build

      # A wheel built from the sdist must match one built from the repository,
      # otherwise the sdist is missing something the build needs.
      - name: Check the sdist can rebuild the wheel
        run: |
          python -m pip install twine
          twine check dist/*
          mkdir -p from-sdist && tar xzf dist/*.tar.gz -C from-sdist --strip-components=1
          (cd from-sdist && python -m build --wheel --outdir ../dist-from-sdist)
          python - <<'EOF'
          import pathlib, zipfile
          def names(pattern):
              path = next(pathlib.Path(pattern[0]).glob(pattern[1]))
              with zipfile.ZipFile(path) as z:
                  return {n for n in z.namelist() if '.dist-info' not in n}
          direct = names(('dist', '*.whl'))
          via_sdist = names(('dist-from-sdist', '*.whl'))
          missing = direct - via_sdist
          assert not missing, f'sdist cannot reproduce the wheel; missing {sorted(missing)}'
          print(f'sdist reproduces all {len(direct)} wheel entries')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  cuda:
    name: CUDA ${{ matrix.cuda_path }}
    # Pinned rather than ubuntu-latest: NVIDIA's apt repository path is
    # distro-version specific.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # sm_75 is pyJac's default: the oldest architecture that compiles
          # offline on both toolkits, so it is required on each. CUDA 13
          # dropped offline compilation for Maxwell, Pascal and Volta, which
          # is exactly what this job does -- there is no GPU on the runner --
          # so sm_50, sm_60 and sm_70 are required on 12.6 and absent from
          # 13.3.
          - cuda: '12-6'
            cuda_path: '12.6'
            required_archs: sm_70 sm_75 sm_80 sm_90
            optional_archs: sm_50 sm_60
          - cuda: '13-3'
            cuda_path: '13.3'
            required_archs: sm_75 sm_80 sm_90
            # Blackwell and later are probes; nvcc reports what it actually
            # supports in the step below, which is the authority on whether a
            # failure here means "broken" or "not a real architecture".
            optional_archs: sm_100 sm_103 sm_110 sm_120 sm_121

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      # Installed from NVIDIA's own apt repository rather than a third-party
      # action, and only the compiler: the full toolkit is several GB.
      - name: Install nvcc ${{ matrix.cuda_path }}
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-${{ matrix.cuda }}
          echo "/usr/local/cuda-${{ matrix.cuda_path }}/bin" >> "$GITHUB_PATH"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test,pywrap]'

      # Authoritative, rather than a list we would have to maintain by hand.
      - name: Report what this toolkit supports
        run: |
          nvcc --version
          echo '--- architectures nvcc can target ---'
          nvcc --list-gpu-arch

      # There is no GPU on the runner, so the generated CUDA is compiled but
      # never executed. This catches syntax and API errors, not wrong numbers.
      # The build goes through pyjac.libgen rather than a hand-rolled nvcc
      # loop, so the build machinery and --cuda-arch plumbing are exercised.
      - name: Generate CUDA sources
        run: python -m pyjac --lang cuda --input data/h2o2.inp --build_path out-cuda

      # libgen compiles generated sources directly and never touches the
      # wrapper templates, so it cannot catch a template that still requires
      # something the toolkit has dropped. Building the wrapper needs nvcc but
      # not a GPU, so it belongs here.
      - name: Build the CUDA Python wrapper
        run: python -m pytest -q test/test_pywrap.py -m cuda -rs

      - name: Build for each architecture
        run: |
          summary=""
          status=0
          for arch in ${{ matrix.required_archs }} ${{ matrix.optional_archs }}; do
            case " ${{ matrix.required_archs }} " in
              *" $arch "*) kind=required ;;
              *)           kind=optional ;;
            esac

            rm -rf lib-cuda obj-cuda
            if python -m pyjac.libgen --lang cuda --source_dir out-cuda \
                 --out_dir lib-cuda --obj_dir obj-cuda \
                 --static --cuda-arch "$arch" > "build-$arch.log" 2>&1 \
               && test -f lib-cuda/libcu_pyjac.a; then
              summary="$summary\n| $arch | $kind | built |"
            else
              summary="$summary\n| $arch | $kind | FAILED |"
              echo "::group::$arch ($kind) failed"
              tail -25 "build-$arch.log"
              echo "::endgroup::"
              if [ "$kind" = required ]; then status=1; fi
            fi
          done

          {
            echo "### CUDA ${{ matrix.cuda_path }}"
            echo
            echo "| arch | kind | result |"
            echo "| --- | --- | --- |"
            printf "%b\n" "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

          printf "%b\n" "$summary"
          exit $status
